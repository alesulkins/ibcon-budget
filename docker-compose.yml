services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ibcon
      POSTGRES_PASSWORD: ibcon_secret
      POSTGRES_DB: ibcon_budget
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibcon"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ibcon
      DB_PASSWORD: ibcon_secret
      DB_NAME: ibcon_budget
      DB_SSLMODE: disable
      # Секрет короче 32 символов сервер не принимает — в бою задают свой.
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_in_production_32}
      JWT_EXPIRY_HOURS: 60
      SERVER_PORT: 8080
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
