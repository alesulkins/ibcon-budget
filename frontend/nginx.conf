server {
    listen 80;
    root /usr/share/nginx/html;

    # Запросы к API уходят на бэкенд тем же адресом — фронтенду не нужен
    # CORS, а браузеру не нужен второй хост.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Одностраничное приложение: любой путь отдаёт index.html, маршруты
    # разбирает роутер на клиенте.
    location / {
        try_files $uri /index.html;
    }
}
